name: Proof ledger

# Dogfoods the evalid Action on this repo's own PRs (issue #73):
# every sealed TDD proof added or changed by a PR is verified in CI and
# its claim-vs-evidence ledger is posted as a PR comment (upserted on a
# stable marker, so re-runs update the same comment). Each verdict is
# also exported as SARIF and uploaded to code scanning, so a broken seal
# shows up as an alert in the Security tab; a valid proof uploads zero
# results, which dismisses an alert a previous push of the same PR raised.
#
# - valid proof  -> green check + ✅ ledger comment, no alert
# - broken seal  -> red check + ❌ ledger comment naming the breakage point
#   (binding mismatch, snapshot drift, green-tree drift, replay mismatch)
#   + a code scanning alert (stable partialFingerprint, so re-runs of the
#   same proof update the alert instead of opening a duplicate)
# - no sealed proof in the PR -> job succeeds, nothing posted, no upload

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  # SARIF upload needs security-events: write. Fork PRs run with a
  # read-only token and cannot upload, so the upload step is gated to
  # same-repo PRs (it skips for forks instead of failing); on a
  # same-repo PR an upload failure fails this job loudly — it must
  # never be swallowed (M9 #148 acceptance ③).
  security-events: write

jobs:
  ledger:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Full history: the proof replay materializes unsealed files
          # from the recorded git HEAD via `git archive`.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Verify sealed proofs and post the ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mapfile -t proofs < <(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'specs/changes/*/tdd/*.json' || true)
          if [ "${#proofs[@]}" -eq 0 ]; then
            echo 'No sealed proofs in this PR; nothing to verify.'
            exit 0
          fi
          failed=0
          for proof_file in "${proofs[@]}"; do
            # specs/changes/<change-id>/tdd/<phase>-<attempt>.json
            change_id="$(echo "$proof_file" | cut -d/ -f3)"
            base="$(basename "$proof_file" .json)"
            phase="${base%-*}"
            attempt="${base##*-}"
            echo "--- verifying $change_id / $phase #$attempt ($proof_file)"
            if ! node action/verify-proof.mjs \
              --project-root . \
              --change-id "$change_id" \
              --phase "$phase" \
              --attempt "$attempt" \
              --sarif-out evalid-proof.sarif; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload SARIF to code scanning
        # Runs even when a proof failed (that is when there is an alert
        # to upload); skipped when no proof was verified (no SARIF file).
        # Same-repo PRs only: fork PRs run with a read-only token and
        # cannot upload, so the step skips for them instead of failing.
        # On a same-repo PR an upload failure fails this job loudly —
        # never continue-on-error (M9 #148 acceptance ③).
        if: ${{ always() && hashFiles('evalid-proof.sarif') != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: evalid-proof.sarif
